name: Build and publish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 11 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Build the static application
        run: |
          if test -f requirements.txt; then
            python3 -m venv "$RUNNER_TEMP/app-venv"
            . "$RUNNER_TEMP/app-venv/bin/activate"
            python3 -m pip install -r requirements.txt
          fi
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/build.py
          test -s dist/index.html
      - name: Run application tests
        run: |
          shopt -s nullglob
          tests=(tests/*.test.mjs tests/*.test.cjs)
          if (( ${#tests[@]} )); then
            node --test "${tests[@]}"
          fi
      - name: Test the browser workflow
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-tests"
          . "$RUNNER_TEMP/browser-tests/bin/activate"
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
          python3 tests/browser_smoke.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5
